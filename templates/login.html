<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bakeroz</title>
    <style>
      body {
        display: flex;
        background: #000;
        background-image: url("static/bg.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        min-height: 100vh;
        margin: 0;
        justify-content: center;
        align-items: center;
      }
      .login {
        border-radius: 10px;
        background-color: transparent;
        height: auto;
        width: auto;
        padding: 30px 30px;
        display: flex;
        flex-direction: column;
        backdrop-filter: blur(5px);
        border: 3px solid #ffbb38;
        text-align: center;
        align-items: center;
        box-shadow: 0, 0 10px rgba(0, 0, 0, 0.2);
        letter-spacing: 1px;
        font-family: "Roboto";
        color: white;
        justify-content: space-between;
      }
      .login img {
        height: 200px;
        width: auto;
        display: flex;
        margin-top: -30px;
        border-radius: 50%;
      }
      .login h1 {
        font-family: "Pacifico", cursive;
        color: #ffbb38;
        font-size: 50px;
        letter-spacing: 1px;
        margin-top: -25px;
      }
      .login h3 {
        font-family: "Roboto";
        font-size: 45px;
        font-weight: bold;
        margin-top: -15px;
        margin-bottom: 0px;
      }
      .login input {
        font-family: "Roboto";
        font-size: 20px;
        width: 90%;
        margin: 10px;
        border-radius: 5px;
        border: 3px solid #ffbb38;
        background-color: transparent;
        color: white;
        height: 40px;
      }
      .login p {
        display: flex;
        justify-content: space-between;
        font-size: larger;
        font-family: "Roboto";
      }
      .login p a {
        text-decoration: none;
        color: #ffbb38;
      }
      .login p a:hover {
        text-decoration: underline;
        color: #ffbb38;
      }
      button {
        width: 90%;
        height: 30px;
        color: white;
        background-color: #ffbb38;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        font-size: large;
      }
      button:hover {
        background-color: #e3ba64;
      }
      button:active {
        background-color: #ffe3ac;
      }
      hr {
        color: white;
        background-color: white;
        height: 3px;
        width: 100%;
        margin-top: 0px;
        border: 10px;
      }
      .login input::placeholder {
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="login">
      <img
        src="{{url_for ('static',filename ='BAKEROZ.png')}}"
        alt="logo"
        class="bg"
      />
      <h1>BAKEROZ</h1>
      <h3>Welcome Back!</h3>
      <hr />
      <input
        type="text"
        name="Email"
        placeholder="Enter your Email"
        required="required"
      />
      <input
        type="password"
        name="Password"
        placeholder="Enter your Password"
        required="required"
      />
      <p><a href="#">Forget Password?</a></p>
      <button>Login</button>
      <p>Don't have an account? <a href="#">sign up</a></p>
    </div>
  </body>
</html>
