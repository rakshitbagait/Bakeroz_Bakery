<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakeroz</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
    <style>
        .verify{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: auto;
            width:auto;
            margin: 10px;
            padding: 50px;
            font-family: "Roboto";
            text-align: center;
            /* border: 2px solid black; */
            margin-left: 20px;

        }
        input{
            border-radius: 5px;
            border: 2px solid #ffbb38;
            height: 25px;
            width: 96%;
            margin-left:10px;
            margin: 10px;
            /* font-size: 10px; */
        }
        button{
            border-radius: 5px;
            border: 2px solid #ffbb38;
            height: 25px;
            width: 100%;
            margin: 10px ;
            background-color: #ffbb38;
            color: white;
            font-size: 15px;
            margin-left:10px ;
            cursor: pointer;
        }
        hr{
            width: 97%;
            margin-left: 10px;
            height: 3px;
            background-color:#f7b231;
            border: none;
            border-radius: 5px;
            margin: 10px;
        }
        button:hover{
            background-color: #f7b231;
        }
        button:active{
            background-color: #ffdea0;
        }
        h1{
            background-color: #f7b231;
            width:auto;
            height: inherit;
            color: white;
            border-radius: 5px;
            margin-left:10px ;
        }
    </style>
</head>
<body>
    <div class="verify">
    <form action="">
        <h1>Enter the OTP</h1>
        <hr>
        <input type="text" required ="required" placeholder="Enter the 6 digit OTP">
        <button>Enter OTP</button>
    </form>
    </div>
</body>
</html>
